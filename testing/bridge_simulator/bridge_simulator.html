<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Sai Balaji SMS Bridge Simulator</title>
  <style>
    :root {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --border-color: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      padding: 30px;
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
      margin-bottom: 20px;
    }

    .status-badge.disconnected {
      background-color: var(--danger);
    }

    .status-badge.connected {
      background-color: var(--success);
    }

    .btn {
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: var(--danger);
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .job-card {
      margin-top: 25px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 20px;
      background-color: #f8fafc;
      display: none;
    }

    .job-title {
      font-weight: bold;
      color: var(--primary);
      margin-top: 0;
    }

    .sim-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .sim-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .sim-btn.send {
      background-color: var(--success);
    }

    .sim-btn.fail {
      background-color: var(--danger);
    }

    .logs-panel {
      margin-top: 25px;
      background-color: #1e293b;
      color: #38bdf8;
      border-radius: 8px;
      padding: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sri Sai Balaji SMS Bridge Simulator</h2>
    
    <div id="status-badge" class="status-badge disconnected">Disconnected</div>

    <div class="form-group">
      <label for="device-id">Device UUID (Unique ID)</label>
      <input type="text" id="device-id" value="BRIDGE-SIM-789">
    </div>

    <div class="form-group">
      <label for="device-name">Device Name</label>
      <input type="text" id="device-name" value="Simulator Phone">
    </div>

    <div class="form-group">
      <label for="device-model">Model</label>
      <input type="text" id="device-model" value="Pixel 8 Pro Mock">
    </div>

    <div class="form-group">
      <label for="device-battery">Battery Level (%)</label>
      <input type="number" id="device-battery" value="85" min="1" max="100">
    </div>

    <div class="form-group">
      <label for="device-sim">SIM Card Operator</label>
      <select id="device-sim">
        <option value="Airtel">Airtel</option>
        <option value="Jio">Jio</option>
        <option value="BSNL">BSNL</option>
        <option value="Vodafone Idea">Vodafone Idea</option>
      </select>
    </div>

    <button id="connect-btn" class="btn">Connect Bridge</button>

    <div id="job-card" class="job-card">
      <h4 class="job-title">Incoming SMS Job</h4>
      <div id="job-details"></div>
      <div class="sim-actions">
        <button class="sim-btn send" onclick="simulateResult('Sent')">Simulate Sent (Success)</button>
        <button class="sim-btn fail" onclick="simulateResult('Failed')">Simulate Failed</button>
      </div>
    </div>

    <div class="logs-panel" id="logs-panel">
      [System] Ready to connect...
    </div>
  </div>

  <script>
    let socket = null;
    let currentJob = null;

    const connectBtn = document.getElementById('connect-btn');
    const statusBadge = document.getElementById('status-badge');
    const logsPanel = document.getElementById('logs-panel');
    const jobCard = document.getElementById('job-card');
    const jobDetails = document.getElementById('job-details');

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logsPanel.innerHTML += `<br>[${time}] ${message}`;
      logsPanel.scrollTop = logsPanel.scrollHeight;
    }

    async function registerDevice() {
      const payload = {
        id: document.getElementById('device-id').value,
        name: document.getElementById('device-name').value,
        model: document.getElementById('device-model').value,
        battery: parseInt(document.getElementById('device-battery').value),
        sim: document.getElementById('device-sim').value
      };

      try {
        const response = await fetch('/api/v1/devices/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (response.ok) {
          log("Device registered on server successfully.");
          return payload.id;
        } else {
          log("Registration failed!");
          return null;
        }
      } catch (e) {
        log("Server registration failed: " + e.message);
        return null;
      }
    }

    connectBtn.addEventListener('click', async () => {
      if (socket) {
        socket.close();
        return;
      }

      const deviceId = await registerDevice();
      if (!deviceId) return;

      log("Connecting WebSocket...");
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      // Connect to version 1 Websocket endpoint
      const wsUrl = `${protocol}//${window.location.host}/ws/v1/sms-bridge?device_uuid=${deviceId}`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        log("Connected to server successfully!");
        statusBadge.textContent = "Connected";
        statusBadge.className = "status-badge connected";
        connectBtn.textContent = "Disconnect Bridge";
        connectBtn.className = "btn btn-danger";

        // Report status periodically
        sendBatteryStatus();
      };

      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        log(`Received message type: ${message.type}`);
        
        if (message.type === 'sms_job') {
          currentJob = message.data;
          jobDetails.innerHTML = `
            <p><strong>SMS ID:</strong> ${currentJob.smsId}</p>
            <p><strong>To Phone:</strong> ${currentJob.phone}</p>
            <p><strong>Message:</strong> ${currentJob.message}</p>
          `;
          jobCard.style.display = 'block';
          log(`Job received: Send to ${currentJob.phone}`);
        }
      };

      socket.onclose = () => {
        log("WebSocket connection closed.");
        statusBadge.textContent = "Disconnected";
        statusBadge.className = "status-badge disconnected";
        connectBtn.textContent = "Connect Bridge";
        connectBtn.className = "btn";
        jobCard.style.display = 'none';
        socket = null;
        currentJob = null;
      };

      socket.onerror = (err) => {
        log("WebSocket error: " + err.message);
      };
    });

    function sendBatteryStatus() {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      const data = {
        type: "device_status",
        data: {
          battery: parseInt(document.getElementById('device-battery').value),
          sim: document.getElementById('device-sim').value
        }
      };
      socket.send(JSON.stringify(data));
      log("Sent status update (battery/SIM) to server.");
    }

    document.getElementById('device-battery').addEventListener('change', sendBatteryStatus);
    document.getElementById('device-sim').addEventListener('change', sendBatteryStatus);

    function simulateResult(status) {
      if (!socket || !currentJob) return;

      const response = {
        type: "sms_result",
        data: {
          smsId: currentJob.smsId,
          status: status
        }
      };

      socket.send(JSON.stringify(response));
      log(`Simulated SMS job ${status} event sent to server.`);
      jobCard.style.display = 'none';
      currentJob = null;
    }
  </script>
</body>
</html>
